# Conda environment for MS-ENHANCER-GEN.
#
# Mirrors requirements.txt; see that file for why each package is here and for
# the record of packages deliberately excluded (GEOparse, pybedtools, macs3,
# pyBigWig, pyranges, scanpy, ...).
#
# torch is installed via pip, not conda-forge/pytorch-channel conda, and listed
# FIRST in the pip section. Reason: enformer-pytorch/borzoi-pytorch declare an
# unpinned `torch` dependency, and pip does not reliably see a conda-installed
# torch as satisfying it -- it silently reinstalls a CPU-only wheel from PyPI
# on top of it, so a training run that should use the GPU silently falls back
# to CPU with no error (confirmed on a 4x RTX 3090 host: conda installed a CUDA
# build, then the enformer/borzoi pip install replaced it with CPU-only torch
# 2.13.0, torch.cuda.is_available() -> False). Installing torch via pip's own
# --extra-index-url up front keeps it pip's package for the rest of the
# resolve, so nothing later downgrades it.
#
# The cu126 index below must match the driver on the target machine: run
# `nvidia-smi` and read the "CUDA Version" in its header (that is the driver's
# max *supported* runtime, not what's installed) -- pick the highest cuXXX
# suffix from https://download.pytorch.org/whl/ that does not exceed it (e.g.
# driver reports 12.8 -> cu126 or cu128 both work; driver reports 12.1 -> use
# cu121, but then also drop the torch>=2.6.0 floor below since cu121 wheels
# stop at 2.5.1). --index-url (not --extra-index-url) is required here: pip's
# plain PyPI default for `torch` now bundles its own newest CUDA runtime via
# nvidia-* wheels (cu130 as of torch 2.13), which is *newer* than most
# deployed drivers support and fails at import with "CUDA initialization: The
# NVIDIA driver on your system is too old" -- --extra-index-url does not
# prevent pip from preferring that default. Verified: torch 2.9.1+cu129 (Tesla
# T4, driver 580, CUDA 13.0), torch 2.13.0+cu126 (4x RTX 3090, driver 570.133,
# CUDA 12.8), and torch 2.13.0 / numpy 2.4.6 / pandas 3.0.3 (CPU-only, Python 3.12).

name: ms_enhancer
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy>=1.24
  - pandas>=2.0
  - pyyaml>=6.0
  - biopython>=1.80
  - pytest>=7.0
  - pip
  - pip:
      - --index-url https://download.pytorch.org/whl/cu126
      - --extra-index-url https://pypi.org/simple
      # torch >= 2.6 is required for safe HuggingFace weights loading and torch.amp.GradScaler.
      - torch>=2.6.0
      # Not packaged on conda-forge at the versions this project was verified on.
      - pyfaidx>=0.7
      - pyjaspar>=4.0.0
      # Optional oracles. Install in this order: enformer-pytorch declares
      # transformers==4.56.2 but works under the 4.57.6 that borzoi-pytorch
      # installs, so the resolver warning that follows is expected. See
      # requirements.txt for the verification note.
      - enformer-pytorch
      - borzoi-pytorch
